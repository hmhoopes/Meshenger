<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meshenger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="App/styles.css">
</head>
<body>
  <!-- App title and BLE connection status -->
  <header>
    <h1>Meshenger</h1>
    <div class="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Disconnected</span>
    </div>
  </header>

  <!-- Main navigation: Peers / Messages / Settings -->
  <nav class="main-nav">
    <button class="nav-item nav-item-active" data-section="peers">Peers</button>
    <button class="nav-item" data-section="messages">Messages</button>
    <button class="nav-item" data-section="settings">Settings</button>
  </nav>

  <main>
    <!-- Peers view: list of known peers to open a dedicated chat window -->
    <section id="view-peers" class="view view-active">
      <h2 class="section-title">Peers</h2>
      <ul id="peersList" class="peers-list"></ul>
    </section>

    <!-- Messages view: chat window for the selected peer -->
    <section id="view-messages" class="view">
      <h2 class="section-title" id="chatPeerLabel">No peer selected</h2>
      <div id="messages"></div>
      <!-- Shown when no messages; hidden as soon as first message is appended -->
      <div class="empty-state" id="emptyState">
        <strong>No messages yet</strong>
        <p>Connect to your LocalESP device to send and receive messages over the mesh.</p>
      </div>

      <!-- Input + Send; has class "disabled" until BLE connected -->
      <div class="compose disabled" id="compose">
        <form id="form" submit="return false;">
          <input type="text" id="input" placeholder="Type a message…" disabled autocomplete="off">
          <button type="submit" id="btnSend" disabled>Send</button>
        </form>
      </div>
    </section>

    <!-- Settings view: notification sound + brightness toggles -->
    <section id="view-settings" class="view">
      <h2 class="section-title">Settings</h2>
      <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.9rem;margin-bottom:0.5rem;">
        <input type="checkbox" id="settingSounds" checked>
        Notification sounds
      </label>
      <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.9rem;">
        <input type="checkbox" id="settingBrightness" checked>
        High display brightness
      </label>
    </section>
  </main>

  <!-- Footer: connect button + data path label -->
  <header style="border-top: 1px solid var(--border); border-bottom: none;">
    <span style="font-size: 0.8rem; color: var(--text-muted);">Web app → BLE (Nordic UART) → LocalESP</span>
    <button id="btnConnect">Connect to device</button>
    <button id="btnPeerList">Refresh Peer List</button>
    <button id="btnSetName">Set Device Name</button>
  </header>

  <script type="module" src="App/script.js"></script>
</body>
</html>
