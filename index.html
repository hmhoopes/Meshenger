<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meshenger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    html[data-theme="dark"],
    html:not([data-theme]) {
      --bg: #0d0f12;
      --surface: #161a20;
      --border: #2a3038;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #3fb950;
      --accent-dim: #238636;
      --danger: #f85149;
      --warning: #d29922;
      --radius: 10px;
      --msg-font: 0.95rem;
      --input-font: 0.9rem;
      --title-font: 1.25rem;
    }

    html[data-theme="light"] {
      --bg: #f0f3f6;
      --surface: #ffffff;
      --border: #d1d9e0;
      --text: #1f2328;
      --text-muted: #656d76;
      --accent: #1a7f37;
      --accent-dim: #2da44e;
      --danger: #cf222e;
      --warning: #9a6700;
      --radius: 10px;
      --msg-font: 0.95rem;
      --input-font: 0.9rem;
      --title-font: 1.25rem;
    }

    html[data-font-scale="compact"] {
      --msg-font: 0.85rem;
      --input-font: 0.8rem;
      --title-font: 1.1rem;
    }

    html[data-font-scale="comfortable"] {
      --msg-font: 1.05rem;
      --input-font: 1rem;
      --title-font: 1.35rem;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Full-height column layout */
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.2s, color 0.2s, filter 0.2s;
    }

    body.high-brightness {
      filter: brightness(1.12) contrast(1.05);
    }

    /* Top bar: title + connection status */
    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
    }

    h1 {
      font-size: var(--title-font);
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    /* Status text next to the dot */
    .status {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* Gray dot when disconnected; green + glow when connected */
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .status-dot.connected {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    /* Main content: container for different views (Peers / Messages / Settings) */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      max-width: 640px;
      margin: 0 auto;
      width: 100%;
      padding: 0 1rem;
    }

    /* Top-level nav for Peers / Messages / Settings */
    .main-nav {
      display: flex;
      gap: 0.5rem;
      padding: 0.5rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: #11151b;
    }

    .nav-item {
      padding: 0.35rem 0.9rem;
      font-size: 0.85rem;
      background: transparent;
      color: var(--text-muted);
      border-radius: 999px;
      border: 1px solid transparent;
    }

    .nav-item.nav-item-active {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(63, 185, 80, 0.15);
    }

    /* Section containers – only one is visible at a time */
    .view {
      display: none;
    }

    .view-active {
      display: block;
    }

    #view-messages.view-active {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    #view-messages .section-title {
      flex-shrink: 0;
    }

    .section-title {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .peers-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .peers-list button {
      width: 100%;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.5rem 0.75rem;
      font-size: 0.85rem;
    }

    .peers-list button.active {
      border-color: var(--accent);
    }

    /* Scrollable list of message bubbles */
    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 1rem 0;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      scroll-behavior: smooth;
    }

    /* Base bubble style; .sent and .received control side + color */
    .message {
      max-width: 85%;
      padding: 0.6rem 0.9rem;
      border-radius: var(--radius);
      font-size: var(--msg-font);
      line-height: 1.4;
      word-break: break-word;
    }

    .message.sent.delivery-pending {
      opacity: 0.85;
      border: 1px dashed var(--text-muted);
    }

    .message.sent.delivery-failed {
      border: 1px solid var(--danger);
      background: var(--accent-dim);
      box-shadow: inset 0 0 0 1px rgba(248, 81, 73, 0.2);
    }

    html[data-theme="light"] .message.sent.delivery-failed {
      background: #ffebe9;
    }

    .message .delivery-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
    }

    .message.sent.delivery-failed .delivery-label {
      color: var(--danger);
      font-weight: 600;
    }

    .message.sent.delivery-pending .delivery-label {
      color: var(--warning);
    }

    .message.sent {
      align-self: flex-end;
      background: var(--accent-dim);
      color: var(--text);
    }

    .message.received {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .message .time {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    /* Shown when there are no messages yet */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-align: center;
      padding: 2rem;
    }

    .empty-state.hidden {
      display: none;
    }

    .empty-state p {
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }

    /* Message input row; .disabled hides Send when not connected */
    .compose {
      flex-shrink: 0;
      padding: 1rem 0 1.5rem;
      border-top: 1px solid var(--border);
    }

    .compose form {
      display: flex;
      gap: 0.5rem;
    }

    /* Text input for typing messages; disabled until BLE connected */
    #input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--input-font);
      padding: 0.65rem 1rem;
      outline: none;
      transition: border-color 0.15s;
    }

    #input:focus {
      border-color: var(--accent);
    }

    #input::placeholder {
      color: var(--text-muted);
    }

    #input:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Shared button base; #btnConnect and #btnSend override colors */
    button {
      font-family: 'Outfit', sans-serif;
      font-weight: 500;
      cursor: pointer;
      color: var(--text);
      border: none;
      border-radius: var(--radius);
      transition: background 0.15s, opacity 0.15s;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Green = Connect; when .connected, switch to red Disconnect */
    #btnConnect {
      background: var(--accent);
      color: var(--bg);
      padding: 0.65rem 1.25rem;
      font-size: 0.9rem;
    }

    #btnPeerList{
      background: var(--accent);
      color: var(--bg);
      padding: 0.65rem 1.25rem;
      font-size: 0.9rem;
    }

    #btnConnect:hover:not(:disabled) {
      background: #4dce68;
    }

    #btnPeerList:hover:not(:disabled) {
      background: #4dce68;
    }

    #btnConnect.connected {
      background: var(--danger);
      padding: 0.65rem 1rem;
    }

    #btnConnect.connected:hover:not(:disabled) {
      background: #da3633;
    }

    #btnSend {
      background: var(--accent);
      color: var(--bg);
      padding: 0.65rem 1rem;
      font-size: 0.9rem;
    }

    #btnSend:hover:not(:disabled) {
      background: #4dce68;
    }

    /* Send only visible when compose is enabled (BLE connected) */
    .compose.disabled #btnSend {
      display: none;
    }

    .settings-group {
      margin-bottom: 1.25rem;
    }

    .settings-group h3 {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .settings-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }

    .settings-row select {
      flex: 1;
      max-width: 220px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 0.4rem 0.5rem;
      font-family: inherit;
      font-size: 0.85rem;
    }

    .btn-retry {
      margin-top: 0.35rem;
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .btn-retry:hover:not(:disabled) {
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <!-- App title and BLE connection status -->
  <header>
    <h1>Meshenger</h1>
    <div class="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Disconnected</span>
    </div>
  </header>

  <!-- Main navigation: Peers / Messages / Settings -->
  <nav class="main-nav">
    <button class="nav-item nav-item-active" data-section="peers">Peers</button>
    <button class="nav-item" data-section="messages">Messages</button>
    <button class="nav-item" data-section="settings">Settings</button>
  </nav>

  <main>
    <!-- Peers view: list of known peers to open a dedicated chat window -->
    <section id="view-peers" class="view view-active">
      <h2 class="section-title">Peers</h2>
      <ul id="peersList" class="peers-list"></ul>
    </section>

    <!-- Messages view: chat window for the selected peer -->
    <section id="view-messages" class="view">
      <h2 class="section-title" id="chatPeerLabel">No peer selected</h2>
      <div id="messages"></div>
      <!-- Shown when no messages; hidden as soon as first message is appended -->
      <div class="empty-state" id="emptyState">
        <strong>No messages yet</strong>
        <p>Connect to your LocalESP device to send and receive messages over the mesh.</p>
      </div>

      <!-- Input + Send; has class "disabled" until BLE connected -->
      <div class="compose disabled" id="compose">
        <form id="form" submit="return false;">
          <input type="text" id="input" placeholder="Type a message…" disabled autocomplete="off">
          <button type="submit" id="btnSend" disabled>Send</button>
        </form>
      </div>
    </section>

    <section id="view-settings" class="view">
      <h2 class="section-title">Settings</h2>

      <div class="settings-group">
        <h3>Appearance</h3>
        <label class="settings-row">
          Theme
          <select id="settingTheme" aria-label="Color theme">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
            <option value="system">Match system</option>
          </select>
        </label>
        <label class="settings-row">
          Text size
          <select id="settingFontScale" aria-label="Text size">
            <option value="compact">Compact</option>
            <option value="normal" selected>Default</option>
            <option value="comfortable">Comfortable</option>
          </select>
        </label>
      </div>

      <div class="settings-group">
        <h3>Feedback</h3>
        <label class="settings-row">
          <input type="checkbox" id="settingSounds" checked>
          Notification sound on new message
        </label>
        <label class="settings-row">
          <input type="checkbox" id="settingBrightness" checked>
          Higher display brightness
        </label>
      </div>
    </section>
  </main>

  <!-- Footer: connect button + data path label -->
  <header style="border-top: 1px solid var(--border); border-bottom: none;">
    <span style="font-size: 0.8rem; color: var(--text-muted);">Web app → BLE (Nordic UART) → LocalESP</span>
    <button id="btnConnect">Connect to device</button>
    <button id="btnPeerList">Refresh Peer List</button>
  </header>

  <script>
    // --- Nordic UART Service (NUS) ---
    // UUIDs must match LocalESP ble_serial.ino so the browser can find and use the service
    const NUS_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const NUS_RX = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';  // we write here (app → ESP32)
    const NUS_TX = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';  // we subscribe here (ESP32 → app)

    // --- DOM references ---
    const messagesEl = document.getElementById('messages');
    const emptyState = document.getElementById('emptyState');
    const compose = document.getElementById('compose');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const btnConnect = document.getElementById('btnConnect');
    const btnPeerList = document.getElementById('btnPeerList');
    const btnSend = document.getElementById('btnSend');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const navButtons = document.querySelectorAll('.nav-item');
    const peersListEl = document.getElementById('peersList');
    const peersView = document.getElementById('view-peers');
    const messagesView = document.getElementById('view-messages');
    const settingsView = document.getElementById('view-settings');
    const chatPeerLabel = document.getElementById('chatPeerLabel');
    const settingTheme = document.getElementById('settingTheme');
    const settingFontScale = document.getElementById('settingFontScale');
    const settingSounds = document.getElementById('settingSounds');
    const settingBrightness = document.getElementById('settingBrightness');

    const LS_THEME = 'meshenger-theme';
    const LS_FONT = 'meshenger-font-scale';
    const LS_SOUNDS = 'meshenger-sounds';
    const LS_BRIGHT = 'meshenger-brightness';

    // peers[].messages[]: { id, content, sent, delivery?: 'pending'|'sent'|'failed' }
    let peers = [];
    let nextMsgId = 1;

    // BLE connection state
    let device = null;
    let server = null;
    let rxChar = null;
    let txChar = null;
    let rxBuffer = '';  // buffer incomplete lines from TX notifications (split on \n)
    let sending = false;  // prevent double-send and duplicate UI messages

    // UI state
    let currentSection = 'peers';
    let currentPeerId = null;

    function loadSettingsFromStorage() {
      settingTheme.value = localStorage.getItem(LS_THEME) || 'dark';
      settingFontScale.value = localStorage.getItem(LS_FONT) || 'normal';
      settingSounds.checked = localStorage.getItem(LS_SOUNDS) !== '0';
      settingBrightness.checked = localStorage.getItem(LS_BRIGHT) !== '0';
    }

    function resolveTheme() {
      const v = settingTheme.value;
      if (v === 'system') {
        return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      return v;
    }

    function applyAppearance() {
      document.documentElement.setAttribute('data-theme', resolveTheme());
      const fs = settingFontScale.value;
      if (fs === 'normal') {
        document.documentElement.removeAttribute('data-font-scale');
      } else {
        document.documentElement.setAttribute('data-font-scale', fs);
      }
      document.body.classList.toggle('high-brightness', settingBrightness.checked);
    }

    function playReceiveSound() {
      if (!settingSounds.checked) return;
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        const ctx = new Ctx();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g);
        g.connect(ctx.destination);
        o.frequency.value = 740;
        g.gain.setValueAtTime(0.06, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
        o.start(ctx.currentTime);
        o.stop(ctx.currentTime + 0.12);
      } catch (_) {}
    }

    function scrollMessagesToBottom() {
      requestAnimationFrame(() => {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      });
    }

    /** Switch between Peers, Messages, and Settings sections */
    function setSection(section) {
      currentSection = section;
      navButtons.forEach(btn => {
        btn.classList.toggle('nav-item-active', btn.dataset.section === section);
      });
      peersView.classList.toggle('view-active', section === 'peers');
      messagesView.classList.toggle('view-active', section === 'messages');
      settingsView.classList.toggle('view-active', section === 'settings');
    }

    /** Populate the peers list in the Peers view */
    function renderPeers() {
      peersListEl.innerHTML = '';
      peers.forEach(peer => {
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.textContent = peer.name;
        btn.addEventListener('click', () => selectPeer(peer.name));
        console.log('Added peer to list:', peer.name);
        li.appendChild(btn);
        peersListEl.appendChild(li);
      });
    }

    /** Handle peer selection and open its chat window */
    function selectPeer(peerId) {
      currentPeerId = peerId;
      const peer = peers.find(p => p.name === peerId);
      if (!peer) return;
      chatPeerLabel.textContent = `Chat with ${peer.name}`;
      const buttons = peersListEl.querySelectorAll('button');
      buttons.forEach(btn => {
        btn.classList.toggle('active', btn.textContent === peer.name);
      });
      messagesEl.replaceChildren();
      peer.messages.forEach((message) => {
        if (!message.id) message.id = 'm' + nextMsgId++;
        const delivery = message.sent ? (message.delivery || 'sent') : undefined;
        appendMessageEl(message.content, message.sent, { id: message.id, delivery });
      });
      scrollMessagesToBottom();
      setSection('messages');
    }

    // --- Connection & UI helpers ---
    /** Update UI and input state when BLE connection changes */
    function setConnected(connected) {
      statusDot.classList.toggle('connected', connected);
      statusText.textContent = connected ? 'Connected' : 'Disconnected';
      btnConnect.textContent = connected ? 'Disconnect' : 'Connect to device';
      btnConnect.classList.toggle('connected', connected);
      input.disabled = !connected;
      btnSend.disabled = !connected;
      compose.classList.toggle('disabled', !connected);  // shows/hides Send button
    }

    function updateMessageEl(msgId, { delivery }) {
      const el = messagesEl.querySelector(`[data-msg-id="${msgId}"]`);
      if (!el || !el.classList.contains('sent')) return;
      el.classList.remove('delivery-pending', 'delivery-failed');
      if (delivery === 'pending') el.classList.add('delivery-pending');
      if (delivery === 'failed') el.classList.add('delivery-failed');
      const label = el.querySelector('.delivery-label');
      el.querySelectorAll('.btn-retry').forEach((b) => b.remove());
      if (!label) return;
      if (delivery === 'pending') {
        label.textContent = 'Sending…';
        label.style.display = 'block';
      } else if (delivery === 'failed') {
        label.textContent = 'Not delivered';
        label.style.display = 'block';
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'btn-retry';
        b.textContent = 'Retry';
        b.addEventListener('click', () => resendMessage(msgId));
        el.appendChild(b);
      } else {
        label.textContent = '';
        label.style.display = 'none';
      }
    }

    function appendMessageEl(text, sent, opts = {}) {
      emptyState.classList.add('hidden');
      const id = opts.id != null ? opts.id : 'm' + nextMsgId++;
      const div = document.createElement('div');
      div.dataset.msgId = id;
      div.className = 'message ' + (sent ? 'sent' : 'received');
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      if (sent) {
        div.innerHTML = `<span class="content">${escapeHtml(text)}</span><div class="time">${time}</div><div class="delivery-label"></div>`;
        updateMessageEl(id, { delivery: opts.delivery || 'sent' });
      } else {
        div.innerHTML = `<span class="content">${escapeHtml(text)}</span><div class="time">${time}</div>`;
      }
      messagesEl.appendChild(div);
      scrollMessagesToBottom();
      return id;
    }

    /** Escape text so it's safe to put in HTML (avoids XSS if ESP32 sends script) */
    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    /** Return true if string looks like displayable text (not garbage/binary from BLE) */
    function isDisplayableText(s) {
      if (!s || s.length > 1024) return false;
      let printable = 0;
      for (let i = 0; i < s.length; i++) {
        const c = s.charCodeAt(i);
        if (c === 0xFFFD) return false;
        if ((c >= 0x20 && c <= 0x7E) || c === 9 || c === 10 || c === 13) printable++;
      }
      return printable >= Math.min(s.length, 1);
    }

    /** Connect to LocalESP over BLE (or disconnect if already connected) */
    async function connect() {
      // If already connected, disconnect and bail
      if (device && server && server.connected) {
        try {
          server.disconnect();
        } catch (_) {}
        setConnected(false);
        device = server = rxChar = txChar = null;
        return;
      }

      try {
        // 1) Show browser's BLE device picker.
        //    Filter by NUS service; fallback to name prefix so "Meshenger-Pager" / "Meshenger-PagerTest" shows.
        device = await navigator.bluetooth.requestDevice({
          filters: [
            { services: [NUS_SERVICE] },
            { namePrefix: 'Meshenger' }
          ],
          optionalServices: [NUS_SERVICE]
        });

        // 2) Connect to GATT server on the ESP32
        const gatt = await device.gatt.connect();
        server = gatt;

        // 3) Get NUS service and the two characteristics
        const service = await gatt.getPrimaryService(NUS_SERVICE);
        txChar = await service.getCharacteristic(NUS_TX);
        rxChar = await service.getCharacteristic(NUS_RX);

        // 4) Subscribe to TX – we get notified when ESP32 sends data
        rxBuffer = '';
        await txChar.startNotifications();
        txChar.addEventListener('characteristicvaluechanged', (e) => {
          console.log("characteristic value changed");
          const value = e.target.value;
          if (!value || value.byteLength === 0) return;
          let decoded;
          console.log("attempting decode");
          try {
            decoded = new TextDecoder('utf-8', { fatal: false }).decode(value);
          } catch (_) { return; }
          console.log("decoded value:", decoded);
          rxBuffer += decoded;
          console.log("updated rxBuffer:", rxBuffer);
          //first character of rxBuffer is the characteristic value type, 'l' for peer list, 'm' for message
          if (rxBuffer[0] == 'm'){
            console.log('Received message data from device:', rxBuffer);
            rxBuffer = rxBuffer.slice(1); //remove the type character
          } else if (rxBuffer[0] == 'l'){
            rxBuffer = rxBuffer.slice(1); //remove the type character
            console.log('Received peer list data from device:', rxBuffer);
            const newPeers = JSON.parse(rxBuffer);
            for (const peer of newPeers) {
              console.log("Processing peer from device:", peer);
              if (!peers.some(p => p.name === peer)) {
                console.log("Adding new peer to list:", peer);
                peers.push({name: peer, messages: []});
              }
            }
            console.log("Updated peers list:", peers);
            renderPeers(); // update UI
            rxBuffer = ''; // clear buffer after processing peer list
            return; // exit early since we don't want to treat peer list as messages
          }
          const targetPeerId = rxBuffer.slice(0, 17);
          rxBuffer = rxBuffer.slice(17); //remove the target peer ID from the buffer
          console.log("Extracted target peer ID:", targetPeerId);
          console.log("rxBuffer after slicing:", rxBuffer);
          const lines = rxBuffer.split(/\r?\n/);
          console.log("Split rxBuffer into lines:", lines);
          rxBuffer = '';
          console.log("Remaining rxBuffer after popping last line:", rxBuffer);
          lines.forEach(line => {
            console.log("in line for loop")
            console.log("Processing line from device:", line);
            const trimmed = line.trim();
            console.log("Processing line:", trimmed);
            if (trimmed && isDisplayableText(trimmed)) {
              const rcvPeer = peers.find((p) => p.name === targetPeerId);
              if (rcvPeer) {
                const mid = appendMessageEl(trimmed, false);
                rcvPeer.messages.push({ id: mid, content: trimmed, sent: false });
                playReceiveSound();
              }
            }
          });
        });

        device.addEventListener('gattserverdisconnected', () => {
          if (currentPeerId) {
            const p = peers.find((x) => x.name === currentPeerId);
            if (p) {
              p.messages.forEach((m) => {
                if (m.sent && m.delivery === 'pending') {
                  m.delivery = 'failed';
                  updateMessageEl(m.id, { delivery: 'failed' });
                }
              });
            }
          }
          setConnected(false);
        });
        setConnected(true);
      } catch (err) {
        // User cancelled the device picker – don't show an error
        if (err.name !== 'NotFoundError') {
          console.error(err);
          alert('Connection failed: ' + (err.message || err));
        }
      }
    }

    async function bleWritePayloadForPeer(peerObj, trimmed) {
      if (!rxChar || !server || !server.connected) {
        throw new Error('Not connected');
      }
      const encoder = new TextEncoder();
      const data = encoder.encode(
        'm' + peerObj.name + trimmed + '\n' + String.fromCharCode(3)
      );
      const chunk = 20;
      for (let i = 0; i < data.length; i += chunk) {
        await rxChar.writeValue(data.slice(i, i + chunk));
        scrollMessagesToBottom();
      }
    }

    async function resendMessage(msgId) {
      const peerObj = peers.find((p) => p.name === currentPeerId);
      if (!peerObj || !rxChar || sending) return;
      const rec = peerObj.messages.find((m) => m.id === msgId);
      if (!rec || !rec.sent) return;
      sending = true;
      btnSend.disabled = true;
      rec.delivery = 'pending';
      updateMessageEl(msgId, { delivery: 'pending' });
      scrollMessagesToBottom();
      try {
        await bleWritePayloadForPeer(peerObj, rec.content);
        rec.delivery = 'sent';
        updateMessageEl(msgId, { delivery: 'sent' });
      } catch (err) {
        console.error(err);
        rec.delivery = 'failed';
        updateMessageEl(msgId, { delivery: 'failed' });
      } finally {
        sending = false;
        btnSend.disabled = !device || !server || !server.connected;
      }
    }

    /** Send text to ESP32 via NUS RX; scrolls during chunked write; marks Not delivered on failure */
    async function sendMessage(text) {
      const trimmed = text.trim();
      if (!rxChar || !trimmed || sending) return;
      if (!currentPeerId) {
        alert('Select a peer in Peers first.');
        return;
      }
      const peerObj = peers.find((p) => p.name === currentPeerId);
      if (!peerObj) {
        alert('Unknown peer.');
        return;
      }
      sending = true;
      btnSend.disabled = true;
      const msgId = 'm' + nextMsgId++;
      peerObj.messages.push({
        id: msgId,
        content: trimmed,
        sent: true,
        delivery: 'pending',
      });
      appendMessageEl(trimmed, true, { id: msgId, delivery: 'pending' });
      scrollMessagesToBottom();
      try {
        await bleWritePayloadForPeer(peerObj, trimmed);
        const rec = peerObj.messages.find((m) => m.id === msgId);
        if (rec) rec.delivery = 'sent';
        updateMessageEl(msgId, { delivery: 'sent' });
      } catch (err) {
        console.error(err);
        const rec = peerObj.messages.find((m) => m.id === msgId);
        if (rec) rec.delivery = 'failed';
        updateMessageEl(msgId, { delivery: 'failed' });
      } finally {
        sending = false;
        btnSend.disabled = !device || !server || !server.connected;
      }
    }

    /** Ask ESP32 for the current list of connected peers */
    async function requestPeers() {
      if (!rxChar) return;
      const encoder = new TextEncoder();
      //encodes with message type 'l' for peer list request
      await rxChar.writeValue(encoder.encode('l'));  // command to trigger peer list response
      console.log('Requested peer list from device...');
    }

    // --- Event listeners ---
    btnConnect.addEventListener('click', () => connect());
    btnPeerList.addEventListener('click', () => requestPeers());

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const t = input.value;
      if (!t.trim() || sending) return;
      sendMessage(t);
      input.value = '';
    });

    navButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        const section = btn.dataset.section;
        setSection(section);
        if (section === 'messages') scrollMessagesToBottom();
      });
    });

    settingTheme.addEventListener('change', () => {
      localStorage.setItem(LS_THEME, settingTheme.value);
      applyAppearance();
    });
    settingFontScale.addEventListener('change', () => {
      localStorage.setItem(LS_FONT, settingFontScale.value);
      applyAppearance();
    });
    settingSounds.addEventListener('change', () => {
      localStorage.setItem(LS_SOUNDS, settingSounds.checked ? '1' : '0');
    });
    settingBrightness.addEventListener('change', () => {
      localStorage.setItem(LS_BRIGHT, settingBrightness.checked ? '1' : '0');
      applyAppearance();
    });

    (function bindSystemThemeListener() {
      const mq = window.matchMedia('(prefers-color-scheme: light)');
      const onChange = () => {
        if (settingTheme.value === 'system') applyAppearance();
      };
      if (mq.addEventListener) mq.addEventListener('change', onChange);
      else if (mq.addListener) mq.addListener(onChange);
    })();

    loadSettingsFromStorage();
    applyAppearance();
    renderPeers();
    setSection('peers');
  </script>
</body>
